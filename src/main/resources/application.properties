spring.application.name=ms-eve-Eureka
server.port=8761

# El servidor no debe registrarse a sí mismo ni buscar otros registros
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Repos miento/heartbeat en desarrollo: desactivar auto-preservación
eureka.server.enable-self-preservation=false
# Esperar renovaciones de clientes cada 30s (default)
eureka.server.expected-client-renewal-interval-seconds=30